<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Kodio · Beskyttet præsentation</title>
<style>
:root{--navy:#1a1d46;--blue:#1c80f6;--sky:#73bafb;--soft:#c9cdef;--orange:#ff4c00;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1200px 800px at 70% 20%,#23285e 0%,var(--navy) 55%,#12143a 100%);color:#fbfcff;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;display:grid;place-items:center}
.box{width:min(420px,88vw);text-align:center}
.k{width:64px;margin:0 auto 34px}
.k svg{display:block;width:100%;height:auto}
h1{font-size:26px;font-weight:600;margin-bottom:8px}
p{font-size:16px;color:var(--soft)}
.pins{display:flex;justify-content:center;gap:14px;margin:30px 0 18px}
.pins span{width:54px;height:64px;border-radius:14px;border:2px solid #3a4090;background:#232864;display:grid;place-items:center;font-size:30px;font-weight:600;transition:border-color .2s}
.pins span.f{border-color:var(--sky)}
.pins.err span{border-color:var(--orange)}
.pins.err{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.msg{min-height:22px;font-size:15px;color:var(--soft)}
.msg.err{color:#ff8a5c}
button{margin-top:18px;background:var(--blue);color:#fff;border:0;border-radius:12px;padding:12px 28px;font-size:16px;font-weight:600;cursor:pointer}
</style>
</head>

const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const pin = document.getElementById('pin'), pins = document.getElementById('pins'), msg = document.getElementById('msg');
function paint(){ [...pins.children].forEach((s,i)=>{ s.textContent = pin.value[i] ? '•' : ''; s.classList.toggle('f', i === pin.value.length); }); }
async function unlock(){
  if (pin.value.length !== 4) return;
  msg.className='msg'; msg.textContent='Åbner …';
  try {
    if (!(window.crypto && crypto.subtle)) throw new Error('nocrypto');
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin.value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:ub(P.salt), iterations:P.it, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:ub(P.iv)}, key, ub(P.data)));
    document.open(); document.write(html); document.close();
  } catch(e) {
    msg.className='msg err';
    msg.textContent = e.message === 'nocrypto' ? 'Browseren kan ikke åbne filen her. Brug https-adressen.' : 'Forkert kode. Prøv igen.';
    pins.classList.remove('err'); void pins.offsetWidth; pins.classList.add('err');
    pin.value=''; paint(); pin.focus();
  }
}
pin.addEventListener('input', () => { pin.value = pin.value.replace(/\D/g,'').slice(0,4); paint(); if (pin.value.length === 4) unlock(); });
pin.addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
document.getElementById('go').addEventListener('click', unlock);
pins.addEventListener('click', () => pin.focus());
document.addEventListener('keydown', e => { if (document.activeElement !== pin && /^[0-9]$/.test(e.key)) { pin.focus(); } });
pin.focus(); paint();
</script>
